name: Build WMS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-api-level: 34
          build-tools-version: '34.0.0'

      - name: Generate Gradle wrapper
        run: |
          cd $GITHUB_WORKSPACE
          wget -q https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar || true
          # Create a minimal gradlew if not exists
          if [ ! -f gradlew ]; then
            echo '#!/bin/sh' > gradlew
            echo 'exec java -jar "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" "$@"' >> gradlew
            chmod +x gradlew
          fi
          ls -la gradle/wrapper/

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew gradlew.bat || true

      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          sdkmanager --licenses <<< "y
y
y
y
y
y
y
y
y
" || true

      - name: Build Debug APK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat local.properties
          ./gradlew assembleDebug --stacktrace || ./gradlew assembleDebug -x lint -x lintVitalRelease --stacktrace || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WMS-v1.0-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
